services:
  mysql:
    image: mysql:8.4
    container_name: bank-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: bank_cloud
      MYSQL_USER: bank
      MYSQL_PASSWORD: bank123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 12

  kafka:
    image: bitnamilegacy/kafka:4.0.0-debian-12-r10
    container_name: bank-kafka
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      ALLOW_PLAINTEXT_LISTENER: "yes"
    ports:
      - "9092:9092"

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: bank-keycloak
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    volumes:
      - ./docker/keycloak/realm-banco.json:/opt/keycloak/data/import/realm-banco.json:ro

  eureka-server:
    build:
      context: .
      dockerfile: eureka-server/Dockerfile
    container_name: eureka-server
    ports:
      - "8761:8761"

  config-server:
    build:
      context: .
      dockerfile: config-server/Dockerfile
    container_name: config-server
    ports:
      - "8888:8888"
    depends_on:
      - eureka-server

  ms-cuentas:
    build:
      context: .
      dockerfile: ms-cuentas/Dockerfile
    container_name: ms-cuentas
    environment:
      DB_URL: jdbc:mysql://mysql:3306/bank_cloud?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
      DB_USER: bank
      DB_PASSWORD: bank123
      EUREKA_URL: http://eureka-server:8761/eureka/
      CONFIG_SERVER_URL: http://config-server:8888
      JWK_SET_URI: http://keycloak:8080/realms/banco/protocol/openid-connect/certs
    ports:
      - "8081:8081"
    depends_on:
      mysql:
        condition: service_healthy
      keycloak:
        condition: service_started
      eureka-server:
        condition: service_started
      config-server:
        condition: service_started

  ms-operaciones:
    build:
      context: .
      dockerfile: ms-operaciones/Dockerfile
    container_name: ms-operaciones
    environment:
      DB_URL: jdbc:mysql://mysql:3306/bank_cloud?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
      DB_USER: bank
      DB_PASSWORD: bank123
      EUREKA_URL: http://eureka-server:8761/eureka/
      CONFIG_SERVER_URL: http://config-server:8888
      JWK_SET_URI: http://keycloak:8080/realms/banco/protocol/openid-connect/certs
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8082:8082"
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_started
      keycloak:
        condition: service_started
      ms-cuentas:
        condition: service_started

  ms-transacciones:
    build:
      context: .
      dockerfile: ms-transacciones/Dockerfile
    container_name: ms-transacciones
    environment:
      DB_URL: jdbc:mysql://mysql:3306/bank_cloud?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
      DB_USER: bank
      DB_PASSWORD: bank123
      EUREKA_URL: http://eureka-server:8761/eureka/
      CONFIG_SERVER_URL: http://config-server:8888
      JWK_SET_URI: http://keycloak:8080/realms/banco/protocol/openid-connect/certs
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8083:8083"
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_started
      keycloak:
        condition: service_started

volumes:
  mysql_data:
